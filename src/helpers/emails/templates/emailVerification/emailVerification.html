<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css?family=Lato:400,900" rel="stylesheet">
    <title>LiveDemo: Verify your email</title>
    <style type="text/css">
    body, .background_main, p, table, td, div {
        font-family: 'Lato', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }
    body {
        background: #fff;
        font-size: 17px;
        line-height: 24px;
        margin: 0;
        padding: 0;
    }
    .verification-code {
        font-size: 32px;
        font-weight: 900;
        letter-spacing: 8px;
        color: #1070ff;
        text-align: center;
        padding: 16px 0;
    }
    </style>
</head>
<body>
<table role="presentation" cellpadding="0" cellspacing="0" width="100%">
    <tr>
        <td align="center" style="padding: 40px 20px;">
            <table role="presentation" cellpadding="0" cellspacing="0" width="600" style="max-width: 600px;">
                <tr>
                    <td style="padding-bottom: 24px;">
                        <h1 style="margin: 0; font-size: 24px; color: #111827;">Verify your email</h1>
                    </td>
                </tr>
                <tr>
                    <td style="padding-bottom: 16px; color: #374151;">
                        <p style="margin: 0 0 12px;">Hi {{name}},</p>
                        <p style="margin: 0 0 12px;">Use this code to verify your LiveDemo account:</p>
                    </td>
                </tr>
                <tr>
                    <td class="verification-code">{{code}}</td>
                </tr>
                <tr>
                    <td style="color: #6b7280; font-size: 14px;">
                        <p style="margin: 0;">If you did not create a LiveDemo account, you can ignore this email.</p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
