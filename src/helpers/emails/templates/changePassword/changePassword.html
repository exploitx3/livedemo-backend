<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css?family=Lato:400,900" rel="stylesheet">
    <title>LiveDemo: Change Password</title>
    <style type="text/css">/* Global Resets */
    body, .background_main, p, table, td, div {
        font-family: 'Lato', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    img {
        border: none;
        -ms-interpolation-mode: bicubic;
        max-width: 100%;
    }

    p {
        padding-bottom: 2px;
    }

    body {
        background: #fff;
        font-size: 17px;
        line-height: 24px;
        margin: 0;
        padding: 0;
        -ms-text-size-adjust: 100%;
        -webkit-text-size-adjust: 100%;
    }

    table {
        border-collapse: collapse;
        mso-table-lspace: 0pt;
        mso-table-rspace: 0pt;
        width: 100%;
    }

    td {
        font-size: 17px;
        line-height: 24px;
        vertical-align: top;
    }

    /* Footer */
    .email_footer td, .email_footer p, .email_footer span, .email_footer a {
        font-size: 15px;
        text-align: center;
    }

    .email_footer td {
        padding-top: 20px;
    }

    /* Typography */
    h1, h2, h3, h4 {
        color: #434245;
        font-weight: 400;
        line-height: 1.4;
        margin: 0;
        margin-bottom: 12px;
    }

    h1 {
        font-size: 30px;
        line-height: 36px;
        font-weight: 900;
        letter-spacing: -.75px;
        text-align: left;
    }

    p, ul, ol {
        font-size: 17px;
        line-height: 24px;
        font-weight: normal;
        margin: 0;
        margin-bottom: 15px;
    }

    p li, ul li, ol li {
        list-style-position: inside;
        margin-left: 5px;
    }

    a {
        color: #3498db;
        text-decoration: none;
    }

    a:hover {
        text-decoration: underline;
    }

    .button_link::after {
        position: absolute;
        content: '';
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        border-radius: 4px;
    }

    .button_link:hover::after {
        box-shadow: inset 0 -2px #237c4a;
    }

    .preview_text {
        color: transparent;
        display: none;
        height: 0;
        max-height: 0;
        max-width: 0;
        opacity: 0;
        overflow: hidden;
        mso-hide: all;
        visibility: hidden;
        width: 0;
        font-size: 1px;
        line-height: 1px;
    }

    .preview_text a {
        color: #3AA3E3 !important;
        font-weight: bold;
    }

    /* Responsive and Mobile Friendly Styles */
    @media only screen and (max-width: 600px) {
        table[class="background_main"] .sm_full_width {
            width: 100% !important;
        }

        table[class="background_main"] .sm_align_center {
            text-align: center !important;
        }

        table[class="background_main"] .sm_auto_width {
            width: auto !important;
        }

        table[class="background_main"] .sm_auto_height {
            height: auto !important;
        }

        table[class="background_main"] .sm_border_box {
            box-sizing: border-box !important;
        }

        table[class="background_main"] .sm_block {
            display: block !important;
        }

        table[class="background_main"] .sm_inline_block {
            display: inline-block !important;
        }

        table[class="background_main"] .sm_table {
            display: table !important;
        }

        table[class="background_main"] .sm_no_side_padding {
            padding-right: 0 !important;
            padding-left: 0 !important;
        }

        table[class="background_main"] .sm_no_border_radius {
            border-radius: 0 !important;
        }

        table[class="background_main"] .sm_no_padding {
            padding-right: 0 !important;
            padding-left: 0 !important;
        }

        table[class="background_main"] .sm_os_icons_height {
            height: 44px;
        }

        .social_img_bottom_margin {
            margin-bottom: 20px !important;
        }

        .social_p_bottom_margin {
            margin-bottom: 40px !important;
        }
    }

    /* More client-specific styles */
    @media all {
        .ExternalClass {
            width: 100%;
        }

        .ExternalClass, .ExternalClass p, .ExternalClass span, .ExternalClass font, .ExternalClass td, .ExternalClass div {
            line-height: 100%;
        }

        .email_footer a {
            color: #434245 !important;
            font-family: inherit !important;
            font-size: inherit !important;
            font-weight: inherit !important;
            line-height: inherit !important;
            text-decoration: none !important;
        }
    }

    a:hover {
        text-decoration: underline !important;
    }
    </style>
</head>

                    <tr>
                        <td style="width: 546px; vertical-align: top; padding-top: 32px">
                            <div style="max-width: 600px; margin: 0 auto;">
                                <h1 style="font-size: 30px; padding-right: 30px; padding-left: 30px;">Change Password</h1>

                                    Name: <a href="{{changePasswordLink}}"
                                              style="white-space: nowrap;color: #0576b9;">{{name}}</a>
                                </h4>
                                <h4 style="margin-bottom: 0; font-size: 17px; font-weight: 400;">
                                    Email: <a href="{{changePasswordLink}}"
                                              style="white-space: nowrap;color: #0576b9;">{{email}}</a>
                                </h4>
                                <h4
                                    style="margin-bottom: 2px; font-size: 17px; font-weight: 400;">
                                    Change Password Link: <a href="{{changePasswordLink}}"
                                                          style="white-space: nowrap;color: #0576b9;">Link</a>
                                </h4>
                            </div>
                        </td>
                    </tr>

            </center>
        </td>
    </tr>
    <tr>
        <td class="email_footer"
            style="font-size: 15px;color: #717274;text-align: center;width: 100%; border-top: 1px solid #E1E1E4">

                <br/>
                 </span>
                    </td>
                    <td> </td>
                </tr>
                <tr>
                    <td> </td>
                    <td style="padding: 16px 8px 24px; vertical-align: top; text-align: center"><span><a
                        href="https://livedemo.ai" style="text-decoration: none;color: #434245;">LiveDemo</a> <span
                        style="color: #D8D8D8;"> • </span> <span style="color: #D8D8D8;"> • </span>
                        <a href="https://livedemo.ai/terms" style="text-decoration: none;color: #434245;">Policies</a></span>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>

</html>
