      - chmod 600 ~/.ssh/id_rsa

      # 4. Add github.com to the list of known hosts to bypass authenticity prompts
      - ssh-keyscan github.com >> ~/.ssh/known_hosts

      # 5. Start the ssh-agent and add the key (optional, useful if multiple keys are needed)
      - eval $(ssh-agent -s)
      - ssh-add ~/.ssh/id_rsa
