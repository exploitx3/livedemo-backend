    - docker tag registry.gitlab.com/georgi.apostolov/story-api:monq-latest registry.gitlab.com/georgi.apostolov/story-api:monq-$CI_COMMIT_SHA
    - docker push registry.gitlab.com/georgi.apostolov/story-api:monq-$CI_COMMIT_SHA
    - docker push registry.gitlab.com/georgi.apostolov/story-api:monq-latest

build:
  stage: build
  when: manual
  only:
    - develop
  script:
    - npm install
